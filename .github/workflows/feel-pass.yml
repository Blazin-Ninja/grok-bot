name: feel-pass

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          sudo unzip -o /tmp/godot.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64
          sudo ln -sf /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Headless smoke
        run: |
          export GODOT=godot
          chmod +x tools/run_smoke.sh
          ./tools/run_smoke.sh
